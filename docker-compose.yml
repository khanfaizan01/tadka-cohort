# Tadka — Java food delivery platform
# PostgreSQL 16 only. Day 5/6/8/13 services are placeholders.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tadka-postgres
    ports:
      # Placeholder: Day 1 only needs the internal port;
      # the actual host binding lives in docker-compose.override.yml (dev)
      # or docker-compose.prod.yml (production).
      - "5432:5432"
    environment:
      POSTGRES_USER: tadka
      POSTGRES_PASSWORD: tadka_local
      POSTGRES_DB: tadka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadka"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

