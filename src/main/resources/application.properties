# Tadka API — Spring Boot / PostgreSQL monolith
server.port=5224
spring.application.name=tadka-api

# ---- DataSource ----
spring.datasource.url=jdbc:postgresql://localhost:5432/tadka
spring.datasource.username=tadka
spring.datasource.password=tadka_local
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- Actuator / Health ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ---- OpenAPI (SpringDoc) ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.title=Tadka API
springdoc.version=0.0.1

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
